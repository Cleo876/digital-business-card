        const DB_NAME = 'DigitalCardDB';
        const STORE_NAME = 'appData';

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
                request.onupgradeneeded = (e) => {
                    e.target.result.createObjectStore(STORE_NAME);
                };
            });
        };

        const dbGet = async (key) => {
            try {
                const db = await initDB();
                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.get(key);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => resolve(null);
                });
            } catch (e) {
                return null;
            }
        };

        const dbSet = async (key, val) => {
            try {
                const db = await initDB();
                return new Promise((resolve) => {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.put(val, key);
                    request.onsuccess = () => resolve();
                    request.onerror = () => resolve();
                });
            } catch (e) { }
        };

            name: "Cleon Williams",

                            )}
                        </div>
                    </div>

                    {/* Full Screen Focus Mode Modal */}
                    <QRModal 
                        link={focusedQR} 
                        onClose={() => setFocusedQR(null)} 
                    />

                    {/* Editor Modal for Adding/Editing Links */}
                    {editingLink && (
                        <LinkEditorModal 
                            link={editingLink.id && linksData.find(l => l.id === editingLink.id) ? editingLink : null}
                            onSave={(savedLink) => {
                                let newLinks;
                                if (linksData.find(l => l.id === savedLink.id)) {
                                    newLinks = linksData.map(l => l.id === savedLink.id ? savedLink : l);
                                } else {
                                    newLinks = [...linksData, savedLink];
                                }
                                handleUpdateLinks(newLinks);
                                setEditingLink(null);
                            }}
                            onDelete={() => {
                                const newLinks = linksData.filter(l => l.id !== editingLink.id);
                                handleUpdateLinks(newLinks);
                                setEditingLink(null);
                            }}
                            onClose={() => setEditingLink(null)}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
